[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpaper"
version = "0.1.0"
description = "Сервер TrainPaper: статика и онлайн-табло РЖД для живых обоев"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trainpaper = "trainpaper.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainpaper = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
