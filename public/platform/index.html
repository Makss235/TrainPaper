<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Платформа — TrainPaper</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/platform.css">
  <link rel="stylesheet" href="../assets/css/info.css">
  <!-- three.js лежит в проекте; движок — public/engine/ (подключает "three" через эту карту);
       загрузчик моделей glTF подгружается, только если в сцене есть модель .glb/.gltf -->
  <script type="importmap">{ "imports": {
    "three": "../vendor/three/three.module.min.js",
    "three/addons/": "../vendor/three/addons/"
  } }</script>
  <script type="module" src="../assets/js/platform/main.js"></script>
</head>
<body>
<!-- холст WebGL движок вставляет первым ребёнком #poster; #board — живой текст табло (компонент HtmlScreen) -->
<div id="poster">
  <div id="html" class="html-layer">
    <div id="board" class="board" role="status" aria-live="polite">
      <div class="screen">
        <div class="led-glow">
          <div class="led">
            <div class="row top"><span id="bKind"></span><span id="bClock"></span></div>
            <div class="row main"><span id="bNum"></span><span id="bRoute"></span></div>
            <div class="row sub" id="bSub"><span id="bTime"></span><span id="bPlace"></span><span id="bDelay"></span></div>
            <div class="row ticker"><div id="bTicker" class="marquee"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- панель с поездом — у вида «Вагон» (в «Платформе» её заменяет табло в сцене) -->
  <aside id="info" aria-live="polite">
    <div class="empty-note">Поездов нет</div>
    <div class="data">
      <div class="status-row"><span id="headline" class="pill"></span><span id="countdown"></span></div>
      <div id="number"></div>
      <div id="route"><span id="from"></span><span class="arrow">→</span><span id="to"></span></div>
      <hr>
      <div class="specs">
        <span class="k" id="kTime">Отправление</span><span class="v" id="vTime"></span>
        <span class="k">Платформа и путь</span><span class="v" id="vPlace"></span>
        <span class="k">Статус</span><span class="v" id="vDelay"></span>
        <span class="k" id="kPos">Сейчас</span><span class="v" id="vPos"></span>
      </div>
      <div id="next"></div>
    </div>
  </aside>
  <div id="ui" class="ui"></div>
</div>
</body>
</html>
