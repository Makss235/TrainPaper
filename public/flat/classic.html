<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вагон — TrainPaper</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600&display=swap">
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="../assets/css/flat.css">
  <script type="module" src="../assets/js/flat/main.js"></script>
</head>
<body>
<div id="poster">
  <div id="sky"><div id="stars"></div><div id="sun"></div><div id="moon"></div></div>
  <svg id="clouds" class="layer" preserveAspectRatio="xMinYMin slice" aria-hidden="true"></svg>
  <svg id="far" class="layer" preserveAspectRatio="xMinYMin slice" aria-hidden="true"></svg>
  <svg id="train" class="layer" preserveAspectRatio="xMinYMin slice" aria-hidden="true"></svg>
  <svg id="near" class="layer" preserveAspectRatio="xMinYMin slice" aria-hidden="true"></svg>
  <div id="vignette"></div>
  <div id="grain"></div>

  <aside id="info" aria-live="polite">
    <div class="empty-note">Поездов нет</div>
    <div class="data">
      <div class="status-row"><span id="headline" class="pill"></span><span id="countdown"></span></div>
      <div id="number"></div>
      <div id="route"><span id="from"></span><span class="arrow">→</span><span id="to"></span></div>
      <hr>
      <div class="specs">
        <span class="k" id="kTime">Отправление</span><span class="v" id="vTime"></span>
        <span class="k">Платформа и путь</span><span class="v" id="vPlace"></span>
        <span class="k">Статус</span><span class="v" id="vDelay"></span>
        <span class="k" id="kPos">Сейчас</span><span class="v" id="vPos"></span>
      </div>
      <div id="next"></div>
    </div>
  </aside>
  <div id="ui" class="ui"></div>
</div>
</body>
</html>
