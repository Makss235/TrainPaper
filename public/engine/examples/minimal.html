<!doctype html>
<!--
  Минимальный пример встраивания движка: сцена описана прямо здесь, без папки моделей и префабов —
  только примитивы, свет, камера и погода. Открыть: http://localhost:8000/engine/examples/minimal.html
  Подробно — docs/embedding.md.
-->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Движок: минимальный пример</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10141c; font: 14px/1.4 system-ui, sans-serif; }
    #view { position: relative; height: 100%; overflow: hidden; }
    .bar { position: absolute; z-index: 2; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .bar button { padding: 4px 10px; border: 0; border-radius: 6px; background: rgba(255,255,255,.85); cursor: pointer; }
  </style>
  <!-- three.js — единственная зависимость движка; путь к своей копии -->
  <script type="importmap">{ "imports": {
    "three": "../../assets/vendor/three/three.module.min.js",
    "three/addons/": "../../assets/vendor/three/addons/"
  } }</script>
</head>
<body>
  <div id="view"><div class="bar" id="bar"></div></div>
  <script type="module">
    import { Engine } from "../index.js";

    const engine = new Engine({
      container: document.getElementById("view"),
      paths: { manifest: null },                     // нет папки моделей — и не нужно
      palette: { stone: "#c4c4bf", roof: "#5e646b" },
    });

    await engine.load({
      name: "Пример",
      environment: { azimuth: 200, weather: "partly", shadows: { x: [-15, 15], y: [-1, 8], z: [10, -40] } },
      objects: [
        { name: "Камера", position: [0, 2, 8],
          components: [{ type: "Camera", main: true, target: [0, 1.5, -10], focal: [0.7, 1.1] }, { type: "CameraParallax" }] },
        { name: "Земля", components: [{ type: "Primitive", shape: "plane", size: [400, 0, 400], color: "#86926f", castShadow: false }] },
        { name: "Дорожка", position: [0, 0.01, -10],
          components: [{ type: "Primitive", shape: "plane", size: [4, 0, 60], color: "stone", castShadow: false,
                         material: { pattern: { type: "tiles", step: [0.6, 0.6], width: 0.02, color: "#a8a9a3" } } }] },
        { name: "Беседка", position: [3.5, 0, -6], children: [
          { name: "Крыша", position: [0, 2.6, 0], components: [{ type: "Primitive", size: [3.4, 0.2, 3.4], color: "roof" }] },
          { name: "Столб", position: [-1.5, 0, -1.5], repeat: { count: 2, step: [3, 0, 0] },
            components: [{ type: "Primitive", shape: "cylinder", size: [0.12, 2.6, 0.12], pivot: "bottom", color: "#eceae4" }] },
          { name: "Столб дальний", position: [-1.5, 0, 1.5], repeat: { count: 2, step: [3, 0, 0] },
            components: [{ type: "Primitive", shape: "cylinder", size: [0.12, 2.6, 0.12], pivot: "bottom", color: "#eceae4" }] },
        ] },
        { name: "Фонарь", position: [-2.4, 0, -4], repeat: { count: 5, step: [0, 0, -9] }, components: [
          { type: "Primitive", size: [0.1, 3.6, 0.1], pivot: "bottom", color: "#3a3e43" },
          { type: "Primitive", size: [0.4, 0.15, 0.4], offset: [0, 3.65, 0], color: "#4b4f54", material: { emissiveNight: [1, 0.86, 0.56] } },
          { type: "Light", range: 7, offset: [0, 3.4, 0] },
          { type: "Glow", radius: 1.1, offset: [0, 3.6, 0] } ] },
        { name: "Дерево", position: [-7, 0, -8], repeat: { count: 6, step: [0, 0, -8], jitter: [2, 0, 2], scaleJitter: 0.25, seed: 4 }, components: [
          { type: "Primitive", shape: "cylinder", size: [0.35, 3, 0.35], pivot: "bottom", color: "#5b4636" },
          { type: "Primitive", shape: "sphere", size: [3.4, 3.4, 3.4], offset: [0, 4, 0], color: "#4f7a4a", material: { toon: true } } ] },
        { name: "Провод", components: [{ type: "Line", points: [[-2.4, 3.5, -4], [-2.4, 3.5, -13], [-2.4, 3.5, -22]], sag: 0.25, width: 0.012 }] },
      ],
    });

    // время и место: солнце и луна считаются сами
    engine.environment.location = { lat: 55.75, lon: 37.62 };
    engine.environment.setTime(Date.now());

    // кнопки: погода и время суток
    const bar = document.getElementById("bar");
    const button = (label, fn) => bar.append(Object.assign(document.createElement("button"), { textContent: label, onclick: fn }));
    for (const [key, label] of engine.weather.presets) button(label, () => engine.weather.set(key));
    for (const [label, alt] of [["День", 40], ["Закат", 1], ["Ночь", -20]]) button(label, () => engine.environment.setSun({ azimuth: 230, altitude: alt }));
    window.engine = engine;
  </script>
</body>
</html>
